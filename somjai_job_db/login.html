<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบ — บริษัท สมใจ 2559 จำกัด</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
         :root {
            --red-900: #7f0000;
            --red-800: #990000;
            --red-700: #b30000;
            --red-600: #cc0000;
            --red-500: #e00000;
            --red-400: #ff2222;
            --red-100: #ffe0e0;
            --red-50: #fff5f5;
            --dark-900: #1a0000;
            --dark-800: #2d0000;
            --font: 'Sarabun', sans-serif;
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: #f5f0f0;
        }
        /* ── LAYOUT ── */
        
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(ellipse at 20% 20%, rgba(180, 0, 0, 0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(180, 0, 0, 0.05) 0%, transparent 60%), #f5f0f0;
        }
        /* ── CARD ── */
        
        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(160, 0, 0, 0.14), 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        /* ── BANNER ── */
        
        .card-banner {
            width: 100%;
            display: block;
        }
        /* ── BODY ── */
        
        .card-body {
            padding: 36px 40px 40px;
        }
        
        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark-900);
            margin-bottom: 4px;
        }
        
        .card-sub {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 28px;
        }
        /* ── FIELDS ── */
        
        .field {
            margin-bottom: 18px;
        }
        
        .field label {
            display: block;
            font-size: 0.83rem;
            font-weight: 600;
            color: #5a2020;
            margin-bottom: 6px;
        }
        
        .input-wrap {
            position: relative;
        }
        
        .input-wrap .icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.4;
            pointer-events: none;
        }
        
        .input-wrap input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            border: 1.5px solid #f0cccc;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 0.95rem;
            color: #1a0000;
            outline: none;
            transition: border-color .18s, box-shadow .18s;
            background: #fff;
        }
        
        .input-wrap input:focus {
            border-color: var(--red-600);
            box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
        }
        
        .input-wrap input.invalid {
            border-color: var(--red-500);
            box-shadow: 0 0 0 3px rgba(220, 0, 0, 0.12);
        }
        /* toggle password */
        
        .toggle-pw {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.4;
            transition: opacity .15s;
            padding: 0;
        }
        
        .toggle-pw:hover {
            opacity: 0.8;
        }
        /* ── ERROR MSG ── */
        
        .error-msg {
            display: none;
            background: #fff0f0;
            border: 1px solid var(--red-200, #ffaaaa);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--red-700);
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }
        
        .error-msg.show {
            display: flex;
        }
        /* ── SUBMIT BTN ── */
        
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--red-700), var(--red-500));
            border: none;
            border-radius: 100px;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 16px rgba(200, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--red-600), var(--red-400));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(200, 0, 0, 0.45);
        }
        
        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        /* spinner */
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        
        .submit-btn.loading .spinner {
            display: block;
        }
        
        .submit-btn.loading .btn-text {
            opacity: 0.8;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* ── FOOTER ── */
        
        .card-footer {
            text-align: center;
            padding: 14px 40px 24px;
            font-size: 0.8rem;
            color: #aaa;
            border-top: 1px solid #f5eeee;
        }
        
        @media (max-width: 480px) {
            .card-body {
                padding: 24px 20px 28px;
            }
            .card-footer {
                padding: 12px 20px 20px;
            }
        }
    </style>
</head>

    <script>
        const API = '/SomjaiJobDB/backend/login.php';

        const usernameEl = document.getElementById('username');
        const passwordEl = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const togglePw = document.getElementById('togglePw');

        // ── Toggle password visibility ───────────────────────────
        togglePw.addEventListener('click', () => {
            const isHidden = passwordEl.type === 'password';
            passwordEl.type = isHidden ? 'text' : 'password';
            togglePw.textContent = isHidden ? '🙈' : '👁️';
        });

        // ── Clear error on input ─────────────────────────────────
        [usernameEl, passwordEl].forEach(el => {
            el.addEventListener('input', () => {
                el.classList.remove('invalid');
                hideError();
            });
        });

        // ── Enter key support ────────────────────────────────────
        [usernameEl, passwordEl].forEach(el => {
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter') doLogin();
            });
        });

        // ── Login ────────────────────────────────────────────────
        loginBtn.addEventListener('click', doLogin);

        async function doLogin() {
            const username = usernameEl.value.trim();
            const password = passwordEl.value.trim();
            hideError();

            // Validate
            let hasError = false;
            if (!username) {
                usernameEl.classList.add('invalid');
                hasError = true;
            }
            if (!password) {
                passwordEl.classList.add('invalid');
                hasError = true;
            }
            if (hasError) {
                showError('กรุณากรอก username และ password');
                return;
            }

            // Loading state
            setLoading(true);

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password
                    }),
                });

                const text = await res.text();
                let json;
                try {
                    json = JSON.parse(text);
                } catch (_) {
                    throw new Error('Server error: ' + text.substring(0, 100));
                }

                if (json.success) {
                    // Save token
                    localStorage.setItem('token', json.token);
                    localStorage.setItem('user', JSON.stringify(json.user));
                    localStorage.setItem('token_expires', json.expires);

                    // Redirect
                    window.location.href = 'get_applications.html';
                } else {
                    showError(json.error || 'เกิดข้อผิดพลาด');
                    passwordEl.value = '';
                    passwordEl.focus();
                }
            } catch (err) {
                showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                console.error(err);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(on) {
            loginBtn.disabled = on;
            loginBtn.classList.toggle('loading', on);
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        // ── Redirect if already logged in ───────────────────────
        if (localStorage.getItem('token')) {
            const expires = localStorage.getItem('token_expires');
            if (expires && new Date(expires) > new Date()) {
                window.location.href = 'get_applications.html';
            }
        }
    </script>

</body>

</html>
